name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BT583Printer.sln
      - name: Build
        run: dotnet build BT583Printer.sln -c Release --no-restore
      - name: Test
        run: dotnet test BT583Printer.sln -c Release --no-build
